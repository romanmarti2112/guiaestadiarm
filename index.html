            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #030712;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.7);
        }
        @media (min-width: 768px) {
            .app-container {
                border-radius: 2.5rem;
                margin-top: 2rem;
                margin-bottom: 2rem;
                overflow: hidden;
                border: 8px solid #1e293b;
            }
        }
        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Modern Glassmorphism styling */
        .glass-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.85));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

</head>

                },

        class GuiaEstadiaApp {
            constructor() {
                this.property = this.resolveProperty();
                this.currentSlide = 0;
                this.carouselInterval = null;
                this.init();
            }

            resolveProperty() {
                const pathParts = window.location.pathname.split('/');
                let slug = "";
                const cIndex = pathParts.indexOf('c');
                if (cIndex !== -1 && pathParts[cIndex + 1]) {
                    slug = pathParts[cIndex + 1];
                } else {
                    const urlParams = new URLSearchParams(window.location.search);
                    slug = urlParams.get('c');
                }
                if (slug && propertiesDatabase[slug]) {
                    return propertiesDatabase[slug];
                }
                return propertiesDatabase["los-alamos"];
            }

            init() {
                this.renderHeaderInfo();
                this.initCarousel();
                this.renderMainContent();
            }

            renderHeaderInfo() {
                document.getElementById('prop-nombre').innerText = this.property.nombre;
                document.getElementById('prop-ubicacion').innerHTML = `<i class="fa-solid fa-location-dot text-violet-400"></i> <span>${this.property.ubicacion}</span>`;
                document.getElementById('prop-tagline').innerText = `"${this.property.tagline}"`;
                document.getElementById('quick-whatsapp').href = `https://wa.me/${this.property.whatsapp}?text=Hola,%20estoy%20en%20${encodeURIComponent(this.property.nombre)}%20y%20quiero%20consultarles:`;
            }

            initCarousel() {
                const carouselContainer = document.getElementById('header-carousel');
                carouselContainer.innerHTML = this.property.fotos.map((foto, index) => `
                    <div class="absolute inset-0 bg-cover bg-center transition-opacity duration-1000 ease-in-out ${index === 0 ? 'opacity-100' : 'opacity-0'}" style="background-image: url('${foto}');" data-slide="${index}"></div>
                `).join('');

                if (this.property.fotos.length > 1) {
                    if (this.carouselInterval) clearInterval(this.carouselInterval);
                    this.carouselInterval = setInterval(() => {
                        this.nextSlide();
                    }, 4500);
                }
            }

            nextSlide() {
                const slides = document.querySelectorAll('#header-carousel > div');
                if (!slides.length) return;
                slides[this.currentSlide].classList.remove('opacity-100');
                slides[this.currentSlide].classList.add('opacity-0');
                this.currentSlide = (this.currentSlide + 1) % slides.length;
                slides[this.currentSlide].classList.remove('opacity-0');
                slides[this.currentSlide].classList.add('opacity-100');
                const indicator = document.getElementById('carousel-indicator');
                if (indicator) {
                    indicator.innerText = `${this.currentSlide + 1}/${slides.length}`;
                }
            }

            renderMainContent() {
                const d = this.property;
                const container = document.getElementById('app-content');
                container.innerHTML = `

                                </div>
                                <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-0.5 transition"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-sm">Wi-Fi de Alta Velocidad</h3>
                                <p class="text-xs text-slate-400 mt-0.5 truncate">${d.wifi.red}</p>
                            </div>
                        </div>

                        <div onclick="window.app.openModal('ubicacion')" class="glass-card p-4 rounded-3xl shadow-xl hover:border-blue-500/50 transition duration-300 cursor-pointer flex flex-col justify-between group">
                            <div class="flex items-center justify-between mb-3">
                                <div class="w-11 h-11 rounded-2xl bg-blue-500/20 border border-blue-500/30 flex items-center justify-center text-blue-300 group-hover:scale-110 transition shadow-lg">
                                    <i class="fa-solid fa-map-location-dot text-lg"></i>
                                </div>
                                <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-0.5 transition"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-sm">Ubicación y Mapas</h3>
                                <p class="text-xs text-slate-400 mt-0.5">Cómo llegar y lugar</p>
                            </div>
                        </div>
                    </div>

                    <!-- Acerca de este alojamiento Section -->
                    ${d.descripcionGeneral ? `
                    <div class="glass-card rounded-3xl p-5 shadow-xl space-y-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-2xl bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-300 shadow-lg">
                                <i class="fa-solid fa-house-chimney text-base"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-sm">Acerca de este alojamiento</h3>
                                <p class="text-xs text-slate-400">Descripción detallada</p>
                            </div>
                        </div>
                        <p class="text-xs text-slate-300 leading-relaxed">${d.descripcionGeneral}</p>
                        ${d.elAlojamiento ? `<div class="pt-1"><strong class="text-xs text-white block mb-1">El alojamiento:</strong><p class="text-xs text-slate-300 leading-relaxed">${d.elAlojamiento}</p></div>` : ''}
                        ${d.accesoHuespedes ? `<div class="pt-1"><strong class="text-xs text-white block mb-1">Acceso de los huéspedes:</strong><p class="text-xs text-slate-300 leading-relaxed">${d.accesoHuespedes}</p></div>` : ''}

                    <!-- Horarios Card -->
                    <div class="glass-card rounded-3xl p-5 shadow-xl">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 rounded-2xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-300 shadow-lg">
                                <i class="fa-regular fa-clock text-base"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-sm">Horarios de Estadía</h3>
                                <p class="text-xs text-slate-400">Check-in y Check-out</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-slate-950/70 p-3.5 rounded-2xl border border-slate-800 text-center shadow-inner">

                                <span class="text-lg font-extrabold text-emerald-400">${d.checkin} hs</span>
                            </div>
                            <div class="bg-slate-950/70 p-3.5 rounded-2xl border border-slate-800 text-center shadow-inner">

                            </div>

                            </div>
                        </div>
                        <div class="space-y-3">
                            ${d.prestaciones.map(p => `

                                    <h4 class="text-xs font-bold text-violet-300 flex items-center gap-2">

                                    <div class="flex flex-wrap gap-1.5 pt-1">
                                        ${p.items.map(item => `
                                            <span class="text-[11px] bg-slate-900 border border-slate-800 text-slate-300 px-2.5 py-1 rounded-xl">${item}</span>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}

                    <!-- House Rules Section -->
                    <div class="glass-card rounded-3xl p-5 shadow-xl space-y-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-2xl bg-purple-500/20 border border-purple-500/30 flex items-center justify-center text-purple-300 shadow-lg">
                                <i class="fa-solid fa-list-check text-base"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-sm">Normas de la Casa</h3>
                                <p class="text-xs text-slate-400">Para una convivencia armoniosa</p>
                            </div>
                        </div>
                        <div class="space-y-2.5">
                            ${d.reglas.map(r => `
                                <div class="flex items-start gap-3 p-3.5 rounded-2xl bg-slate-950/50 border border-slate-800/80">
                                    <div class="w-8 h-8 rounded-xl bg-slate-800/80 flex items-center justify-center text-slate-300 shrink-0 mt-0.5">
                                        <i class="fa-solid ${r.icono} text-xs"></i>
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-bold text-white">${r.titulo}</h4>
                                        <p class="text-xs text-slate-400 mt-0.5 leading-relaxed">${r.desc}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Recommended Places & Restaurants -->
                    ${d.restaurantes && d.restaurantes.length > 0 ? `
                    <div class="glass-card rounded-3xl p-5 shadow-xl space-y-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-2xl bg-rose-500/20 border border-rose-500/30 flex items-center justify-center text-rose-300 shadow-lg">
                                <i class="fa-solid fa-utensils text-base"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-sm">Recomendados Cerca</h3>
                                <p class="text-xs text-slate-400">Gastronomía y paseos</p>
                            </div>
                        </div>
                        <div class="space-y-3">
                            ${d.restaurantes.map(rest => `
                                <div class="p-3.5 rounded-2xl bg-slate-950/70 border border-slate-800 flex flex-col gap-2">
                                    <div class="flex items-start justify-between">
                                        <div>
                                            <h4 class="text-xs font-bold text-white">${rest.nombre}</h4>
                                            <p class="text-xs text-slate-400 mt-0.5">${rest.descripcion}</p>
                                        </div>
                                        <span class="text-[10px] font-semibold bg-rose-500/15 text-rose-300 px-2.5 py-1 rounded-full border border-rose-500/30 shrink-0">${rest.distancia}</span>
                                    </div>
                                    <a href="${rest.maps}" target="_blank" class="self-start text-[11px] font-semibold text-violet-400 hover:text-violet-300 flex items-center gap-1.5 mt-1">
                                        <i class="fa-solid fa-location-arrow"></i> Cómo llegar
                                    </a>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}

                    <!-- Tourist Activities -->
                    ${d.actividades && d.actividades.length > 0 ? `
                    <div class="glass-card rounded-3xl p-5 shadow-xl space-y-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-2xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-300 shadow-lg">
                                <i class="fa-solid fa-mountain-sun text-base"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-sm">Paseos imperdibles</h3>
                                <p class="text-xs text-slate-400">Turismo y excursiones</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 gap-3">
                            ${d.actividades.map(act => `
                                <div class="rounded-2xl overflow-hidden bg-slate-950/70 border border-slate-800 flex flex-col shadow-md">
                                    <div class="h-32 w-full bg-cover bg-center relative" style="background-image: url('${act.imagen}');">
                                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 to-transparent"></div>
                                    </div>
                                    <div class="p-3.5 space-y-2">
                                        <h4 class="text-xs font-bold text-white">${act.nombre}</h4>
                                        <p class="text-xs text-slate-400 leading-relaxed">${act.descripcion}</p>
                                        <a href="${act.maps}" target="_blank" class="inline-flex items-center gap-1.5 text-[11px] font-semibold text-violet-400 hover:text-violet-300 pt-1">
                                            <i class="fa-solid fa-map"></i> Ver en Mapa
                                        </a>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}

                    <!-- Photo Gallery Button Card -->
                    <div onclick="window.app.openModal('galeria')" class="glass-card p-5 rounded-3xl shadow-xl hover:border-violet-500/50 transition duration-300 cursor-pointer flex items-center justify-between group">
                        <div class="flex items-center gap-3.5">
                            <div class="w-11 h-11 rounded-2xl bg-violet-500/20 border border-violet-500/30 flex items-center justify-center text-violet-300 group-hover:scale-110 transition shadow-lg">
                                <i class="fa-solid fa-images text-lg"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-sm">Galería de Fotos</h3>
                                <p class="text-xs text-slate-400">Conocé cada rincón del lugar</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-1 transition"></i>
                    </div>

                    <!-- Airbnb Footer Link -->
                    <div class="text-center pt-2 pb-4 space-y-2">
                        <a href="${d.airbnbUrl}" target="_blank" class="inline-flex items-center justify-center gap-2 px-5 py-3.5 rounded-2xl glass-card text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition w-full shadow-lg border border-slate-800">
                            <i class="fa-brands fa-airbnb text-rose-400 text-base"></i> Ver publicación original en Airbnb
                        </a>
                    </div>
                `;
            }

            openModal(type) {
                const modal = document.getElementById('generic-modal');
                const container = document.getElementById('modal-content-container');
                const d = this.property;
                let content = '';

                if (type === 'wifi') {
                    content = `
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2.5">
                                <div class="w-9 h-9 rounded-xl bg-violet-500/20 text-violet-300 flex items-center justify-center">
                                    <i class="fa-solid fa-wifi"></i>
                                </div>
                                <h3 class="font-bold text-white text-base">Conexión Wi-Fi</h3>
                            </div>
                            <button onclick="window.app.closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div class="space-y-4 pt-2">
                            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                                <div>
                                    <span class="text-xs text-slate-400 block font-medium">Red Wi-Fi (SSID)</span>
                                    <div class="flex items-center justify-between mt-1 bg-slate-900 p-3 rounded-xl border border-slate-800">
                                        <span id="wifi-red" class="font-mono text-sm font-bold text-white">${d.wifi.red}</span>
                                        <button onclick="window.app.copyText('${d.wifi.red}', 'Nombre de red copiado')" class="text-xs bg-violet-500/20 text-violet-300 hover:bg-violet-500/30 px-3 py-1.5 rounded-lg font-semibold transition">Copiar</button>
                                    </div>
                                </div>
                                <div>
                                    <span class="text-xs text-slate-400 block font-medium">Contraseña</span>
                                    <div class="flex items-center justify-between mt-1 bg-slate-900 p-3 rounded-xl border border-slate-800">
                                        <span id="wifi-pass" class="font-mono text-sm font-bold text-emerald-400">${d.wifi.password}</span>
                                        <button onclick="window.app.copyText('${d.wifi.password}', 'Contraseña copiada')" class="text-xs bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30 px-3 py-1.5 rounded-lg font-semibold transition">Copiar</button>
                                    </div>
                                </div>
                            </div>
                            <button onclick="window.app.closeModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 rounded-2xl transition text-sm">Entendido</button>
                        </div>
                    `;
                } else if (type === 'ubicacion') {
                    content = `
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2.5">
                                <div class="w-9 h-9 rounded-xl bg-blue-500/20 text-blue-300 flex items-center justify-center">
                                    <i class="fa-solid fa-map-location-dot"></i>
                                </div>
                                <h3 class="font-bold text-white text-base">Ubicación exacta</h3>
                            </div>
                            <button onclick="window.app.closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div class="space-y-4 pt-2">
                            <p class="text-xs text-slate-300 leading-relaxed">${d.ubicacion}</p>
                            <a href="${d.mapsUrl}" target="_blank" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-3 px-4 rounded-2xl transition text-center flex items-center justify-center gap-2 text-sm shadow-lg">
                                <i class="fa-solid fa-compass"></i> ${d.mapsText}
                            </a>
                            <button onclick="window.app.closeModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 rounded-2xl transition text-sm">Cerrar</button>
                        </div>
                    `;
                } else if (type === 'galeria') {
                    content = `
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2.5">
                                <div class="w-9 h-9 rounded-xl bg-violet-500/20 text-violet-300 flex items-center justify-center">
                                    <i class="fa-solid fa-images"></i>
                                </div>
                                <h3 class="font-bold text-white text-base">Galería Fotográfica</h3>
                            </div>
                            <button onclick="window.app.closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div class="space-y-3 pt-2 max-h-[60vh] overflow-y-auto no-scrollbar">
                            ${d.fotos.map(foto => `
                                <div class="rounded-2xl overflow-hidden h-52 bg-slate-950 border border-slate-800 shadow-md">
                                    <img src="${foto}" class="w-full h-full object-cover" alt="Foto de alojamiento" onerror="this.src='https://placehold.co/600x400/1e293b/a78bfa?text=Casa+Carrodilla'">
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="window.app.closeModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 rounded-2xl transition text-sm mt-3">Cerrar galería</button>
                    `;
                }

                container.innerHTML = content;
                modal.classList.remove('hidden');
            }

            closeModal() {
                document.getElementById('generic-modal').classList.add('hidden');
            }

            copyText(text, msg) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    this.showToast(msg);
                } catch (err) {
                    console.error('Error al copiar', err);
                }
                document.body.removeChild(textArea);
            }

            showToast(msg) {
                const toast = document.getElementById('toast');
                document.getElementById('toast-message').innerText = msg;
                toast.classList.remove('opacity-0', 'translate-y-[-20px]');
                toast.classList.add('opacity-100', 'translate-y-0');
                setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', 'translate-y-[-20px]');
                }, 2500);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.app = new GuiaEstadiaApp();
        });
    </script>
</body>
</html>
